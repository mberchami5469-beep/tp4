
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion d'academy de boxe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Gestion du club de boxe d'academy</h1>
        <p>Gestion des boxeurs et suivi des entraînements</p>
    </header>

    <section class="container my-5">
        <div class="row g-4">

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Total des boxeurs</h4>
                        <p class="card-text" id="totalBoxeurs">0</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Boxeurs actifs</h4>
                        <p class="card-text" id="boxeursActifs">0</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Abonnements payés</h4>
                        <p class="card-text" id="abonnementsPayes">0</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Total des abonnements</h4>
                        <p class="card-text" id="montantTotal">0 DH</p>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <section class="inp">

        <label for="name">Rechercher un boxeur</label><br>
        <input type="text" id="name" placeholder="Nom du boxeur">

        <br><br>

        <label for="categorie">Catégorie</label><br>
        <select id="categorie">
            <option value="all">Toutes les catégories</option>
            <option value="Débutant">Débutant</option>
            <option value="Amateur">Amateur</option>
            <option value="Professionnel">Professionnel</option>
        </select>

        <br><br>

        <label>Statut du boxeur</label><br>
        <button type="button" class="status-btn btnactive" data-status="all">Tous</button>
        <button type="button" class="status-btn" data-status="Actif">Actifs</button>
        <button type="button" class="status-btn" data-status="Inactif">Inactifs</button>

        <br><br>

        <input type="checkbox" id="check">
        <label for="check">Afficher uniquement les abonnements payés</label>

    </section>

    <section class="container my-4">
        <div class="table-responsive">
            <p id="resultCount">0 boxeur affiché</p>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Boxeur</th>
                        <th>Catégorie</th>
                        <th>Abonnement</th>
                        <th>Paiement</th>
                        <th>Date d'inscription</th>
                        <th>Détail</th>
                    </tr>
                </thead>

                <tbody id="boxeursTable">

                </tbody>
            </table>
        </div>

        <div id="detailBoxeur"></div>
        <div id="messageErreur"></div>
    </section>

    <script type="module" src="js/app.js"></script>

</body>
</html>
